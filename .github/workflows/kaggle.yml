name: kaggle-run
on:
  workflow_dispatch:
    inputs:
      action: {description: "push or fetch", required: true, default: push, type: choice, options: [push, fetch]}
      slug:   {description: "name for the Kaggle notebook (lowercase, dashes)", required: true, default: ayush-cut256-cv}
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: check secrets are set
        run: |
          [ -n "$KAGGLE_USERNAME" ] || { echo "::error::repo secret KAGGLE_USERNAME is missing or empty"; exit 1; }
          [ -n "$KAGGLE_API_TOKEN" ] || { echo "::error::repo secret KAGGLE_API_TOKEN is missing or empty"; exit 1; }
      - run: pip install kaggle six pytest && python -m pytest -q test_kaggle_runner.py
      - name: push
        if: inputs.action == 'push'
        run: python kaggle_runner.py run --src mathleteutd/name-that-llm-pb115-coverage-sibling-odds --slug "${{ inputs.slug }}" --cells cut256_cv_cell.txt decode_cell.txt --no-wait
      - name: fetch
        if: inputs.action == 'fetch'
        run: python kaggle_runner.py fetch --ref "${{ inputs.slug }}"
