name: kaggle-run
on:
  workflow_dispatch:
    inputs:
      action: {description: "push, fetch, probe (test what the token may do) or peek (Open Pool columns)", required: true, default: push, type: choice, options: [push, fetch, probe, peek, pool_train, baseline, inspect]}
      slug:   {description: "name for the Kaggle notebook (lowercase, dashes)", required: true, default: ayush-cut256-cv}
      run:    {description: "pool_train only: probe (speed test), A, B or final", required: false, default: probe, type: choice, options: [probe, A, B, final]}
      gpus:   {description: "pool_train only: GPUs to train on (1 or 2)", required: false, default: "2"}
      show:   {description: "inspect only: notebook line ranges, e.g. 24:37-50 4:28-41", required: false, default: ""}
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          pip install --only-binary=:all: kaggle==2.2.5 six==1.17.0 pytest==9.0.1
          python -m pytest -q test_kaggle_runner.py
      - name: check secrets are set
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          [ -n "$KAGGLE_USERNAME" ] || { echo "::error::repo secret KAGGLE_USERNAME is missing or empty"; exit 1; }
          [ -n "$KAGGLE_API_TOKEN" ] || { echo "::error::repo secret KAGGLE_API_TOKEN is missing or empty"; exit 1; }
      - name: push
        if: inputs.action == 'push'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SLUG: ${{ inputs.slug }}
        run: python kaggle_runner.py run --src mathleteutd/name-that-llm-pb115-coverage-sibling-odds --slug "$SLUG" --cells cut256_cv_cell.txt decode_cell.txt --no-wait
      - name: fetch
        if: inputs.action == 'fetch'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SLUG: ${{ inputs.slug }}
        run: |
          pip install --only-binary=:all: numpy==2.3.5
          python kaggle_runner.py fetch --ref "$SLUG"

      - name: probe
        if: inputs.action == 'probe'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python kaggle_runner.py probe
      - name: peek
        if: inputs.action == 'peek'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          pip install --only-binary=:all: pyarrow==22.0.0 pandas==2.3.3 numpy==2.3.5
          python openpool_peek.py
      - name: pool_train
        if: inputs.action == 'pool_train'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SLUG: ${{ inputs.slug }}
          RUN: ${{ inputs.run }}
          GPUS: ${{ inputs.gpus }}
        run: python kaggle_runner.py pool_train --slug "$SLUG" --run "$RUN" --gpus "$GPUS"
      - name: baseline
        if: inputs.action == 'baseline'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          pip install --only-binary=:all: pyarrow==22.0.0 pandas==2.3.3 numpy==2.3.5 scipy==1.16.3 scikit-learn==1.7.2
          kaggle datasets download crtproduction/name-that-llm-open-pool -f ntl_open_pool.parquet -p pool -q
          kaggle competitions download name-that-llm -f train.csv -p comp -q
          for z in pool/*.zip comp/*.zip; do [ -f "$z" ] && unzip -o -q "$z" -d "$(dirname "$z")"; done
          python baseline_tfidf.py --train_csv comp/train.csv --pool pool/ntl_open_pool.parquet --use_pool 0 --out oof_tfidf_A.npz
          python baseline_tfidf.py --train_csv comp/train.csv --pool pool/ntl_open_pool.parquet --use_pool 1 --out oof_tfidf_B.npz
          python baseline_tfidf.py --train_csv comp/train.csv --pool pool/ntl_open_pool.parquet --use_pool 1 --kimi_high_only 1 --out oof_tfidf_C.npz
          python -c "import baseline_tfidf as b; print('\n'.join(b.compare_oof(['oof_tfidf_A.npz','oof_tfidf_B.npz','oof_tfidf_C.npz'])))"
      - name: inspect
        if: inputs.action == 'inspect'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SHOW: ${{ inputs.show }}
        run: |
          pip install --only-binary=:all: pyarrow==22.0.0 pandas==2.3.3 numpy==2.3.5
          python pb115_inspect.py --out pb115_art
