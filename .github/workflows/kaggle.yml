name: kaggle-run
on:
  workflow_dispatch:
    inputs:
      action: {description: "push, fetch, probe (test what the token may do) or peek (Open Pool columns)", required: true, default: push, type: choice, options: [push, fetch, probe, peek, pool_train, baseline, inspect, head_cv, gem37, free_models, scan, blend_p]}
      slug:   {description: "name for the Kaggle notebook (lowercase, dashes)", required: true, default: ayush-cut256-cv}
      run:    {description: "pool_train only: probe (speed test), A, B, P (pool only) or final", required: false, default: probe, type: choice, options: [probe, A, B, P, final]}
      gpus:   {description: "pool_train only: GPUs to train on (1 or 2)", required: false, default: "2"}
      show:   {description: "inspect only: notebook line ranges, e.g. 24:37-50 4:28-41", required: false, default: ""}
      refs:   {description: "scan only: dataset refs to scan instead of searching", required: false, default: ""}
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          pip install --only-binary=:all: kaggle==2.2.5 six==1.17.0 pytest==9.0.1
          python -m pytest -q test_kaggle_runner.py
      - name: check secrets are set
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          [ -n "$KAGGLE_USERNAME" ] || { echo "::error::repo secret KAGGLE_USERNAME is missing or empty"; exit 1; }
          [ -n "$KAGGLE_API_TOKEN" ] || { echo "::error::repo secret KAGGLE_API_TOKEN is missing or empty"; exit 1; }
      - name: push
        if: inputs.action == 'push'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SLUG: ${{ inputs.slug }}
        run: python kaggle_runner.py run --src mathleteutd/name-that-llm-pb115-coverage-sibling-odds --slug "$SLUG" --cells cut256_cv_cell.txt decode_cell.txt --no-wait
      - name: fetch
        if: inputs.action == 'fetch'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SLUG: ${{ inputs.slug }}
        run: |
          pip install --only-binary=:all: numpy==2.3.5
          python kaggle_runner.py fetch --ref "$SLUG"

      - name: probe
        if: inputs.action == 'probe'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python kaggle_runner.py probe
      - name: peek
        if: inputs.action == 'peek'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          pip install --only-binary=:all: pyarrow==22.0.0 pandas==2.3.3 numpy==2.3.5
          python openpool_peek.py
      - name: pool_train
        if: inputs.action == 'pool_train'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SLUG: ${{ inputs.slug }}
          RUN: ${{ inputs.run }}
          GPUS: ${{ inputs.gpus }}
        run: python kaggle_runner.py pool_train --slug "$SLUG" --run "$RUN" --gpus "$GPUS"
      - name: baseline
        if: inputs.action == 'baseline'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          pip install --only-binary=:all: pyarrow==22.0.0 pandas==2.3.3 numpy==2.3.5 scipy==1.16.3 scikit-learn==1.7.2
          kaggle datasets download crtproduction/name-that-llm-open-pool -f ntl_open_pool.parquet -p pool -q
          kaggle competitions download name-that-llm -f train.csv -p comp -q
          for z in pool/*.zip comp/*.zip; do [ -f "$z" ] && unzip -o -q "$z" -d "$(dirname "$z")"; done
          python baseline_tfidf.py --train_csv comp/train.csv --pool pool/ntl_open_pool.parquet --use_pool 0 --out oof_tfidf_A.npz
          python baseline_tfidf.py --train_csv comp/train.csv --pool pool/ntl_open_pool.parquet --use_pool 1 --out oof_tfidf_B.npz
          python baseline_tfidf.py --train_csv comp/train.csv --pool pool/ntl_open_pool.parquet --use_pool 1 --kimi_high_only 1 --out oof_tfidf_C.npz
          python -c "import baseline_tfidf as b; print('\n'.join(b.compare_oof(['oof_tfidf_A.npz','oof_tfidf_B.npz','oof_tfidf_C.npz'])))"
      - name: inspect
        if: inputs.action == 'inspect'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SHOW: ${{ inputs.show }}
        run: |
          pip install --only-binary=:all: pyarrow==22.0.0 pandas==2.3.3 numpy==2.3.5
          python pb115_inspect.py --out pb115_art
      - name: head_cv
        if: inputs.action == 'head_cv'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          pip install --only-binary=:all: pyarrow==22.0.0 pandas==2.3.3 numpy==2.3.5 scipy==1.16.3 scikit-learn==1.7.2 lightgbm==4.6.0
          kaggle datasets download lumibee/ntl-prefixb-full-115 -p pb115 -q --unzip
          kaggle competitions download name-that-llm -f train.csv -p comp -q
          for z in comp/*.zip; do [ -f "$z" ] && unzip -o -q "$z" -d comp; done
          python head_cv.py --pb_dir pb115 --train_csv comp/train.csv
      - name: gem37
        if: inputs.action == 'gem37'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          pip install --only-binary=:all: pyarrow==22.0.0 pandas==2.3.3 numpy==2.3.5 scipy==1.16.3 scikit-learn==1.7.2
          kaggle datasets download crtproduction/name-that-llm-open-pool -f ntl_open_pool.parquet -p pool -q
          kaggle competitions download name-that-llm -f train.csv -p comp -q
          for z in pool/*.zip comp/*.zip; do [ -f "$z" ] && unzip -o -q "$z" -d "$(dirname "$z")"; done
          python pool_gem37.py --train_csv comp/train.csv --pool pool/ntl_open_pool.parquet
          echo "== TF-IDF B, switch off vs on (same grouped holdout)"
          python baseline_tfidf.py --train_csv comp/train.csv --pool pool/ntl_open_pool.parquet --use_pool 1 --drop_gem37_after_oct8 0 --out oof_g37_off.npz | grep -E "holdout|gemini-3\.[678]-flash"
          python baseline_tfidf.py --train_csv comp/train.csv --pool pool/ntl_open_pool.parquet --use_pool 1 --drop_gem37_after_oct8 1 --out oof_g37_on.npz | grep -E "holdout|gemini-3\.[678]-flash"
          python -c "import baseline_tfidf as b; print('\n'.join(b.compare_oof(['oof_g37_off.npz','oof_g37_on.npz'])))"
      - name: blend_p
        if: inputs.action == 'blend_p'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SLUG: ${{ inputs.slug }}
        run: |
          pip install --only-binary=:all: pyarrow==22.0.0 pandas==2.3.3 numpy==2.3.5 scipy==1.16.3 scikit-learn==1.7.2 lightgbm==4.6.0
          kaggle datasets download lumibee/ntl-prefixb-full-115 -p pb115 -q --unzip
          kaggle datasets download crtproduction/name-that-llm-open-pool -f ntl_open_pool.parquet -p pool -q
          kaggle competitions download name-that-llm -f train.csv -p comp -q
          for z in pool/*.zip comp/*.zip; do [ -f "$z" ] && unzip -o -q "$z" -d "$(dirname "$z")"; done
          python kaggle_runner.py fetch --ref "$SLUG" | grep -E "^status|holdout balanced|saved"
          P=$(find kr_work_out -name 'oof_P.npz' | head -1); [ -n "$P" ] || { echo "::error::oof_P.npz not in the run's output"; exit 1; }
          find kr_work_out -name 'test_*.npz' -printf "test file found: %f\n"
          echo "== TF-IDF, pool only, proxy rows dropped (scores every official row)"
          python baseline_tfidf.py --train_csv comp/train.csv --pool pool/ntl_open_pool.parquet --use_pool 1 --official_in_train 0 --out oof_tfidf_P.npz | grep holdout
          echo "== yardstick: head + TF-IDF features (base) vs head + TF-IDF + run P features (new)"
          python head_cv.py --pb_dir pb115 --train_csv comp/train.csv --base_block oof_tfidf_P.npz --block "$P" --out oof_head_t.npz
          echo "== probability blend: head, TF-IDF, run P"
          python head_cv.py --pb_dir pb115 --train_csv comp/train.csv --out oof_head.npz > /dev/null
          python blend_eval.py oof_head.npz oof_tfidf_P.npz "$P" --names head tfidf P
      - name: free_models
        if: inputs.action == 'free_models'
        run: python list_free_models.py
      - name: scan
        if: inputs.action == 'scan'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          REFS: ${{ inputs.refs }}
        run: |
          pip install --only-binary=:all: pyarrow==22.0.0 pandas==2.3.3 numpy==2.3.5 scipy==1.16.3 scikit-learn==1.7.2
          kaggle datasets download crtproduction/name-that-llm-open-pool -f ntl_open_pool.parquet -p pool -q
          kaggle competitions download name-that-llm -f train.csv -p comp -q
          for z in pool/*.zip comp/*.zip; do [ -f "$z" ] && unzip -o -q "$z" -d "$(dirname "$z")"; done
          python datasets_scan.py --train_csv comp/train.csv --pool pool/ntl_open_pool.parquet --extra seyitkaangunes/ntl-extra-api-passages abdullah1afify/ntl-generations dophuchung/ntl-proxy-generations dhruvtibarewal/nlm-matched-clean lucasboesen/ntl-free-proxy-generations prvsiyan/prvsiyans-extended-name-that-llm-dataset
